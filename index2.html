<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ML Beauty Studio | Ubicación</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f4f4;
            text-align: center;
            margin: 0;
            padding: 20px;
        }

        h1 {
            color: #333;
            margin-bottom: 20px;
        }

        .mapa {
            width: 100%;
            max-width: 900px;
            margin: auto;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 0 10px rgba(0,0,0,.2);
        }

        iframe {
            width: 100%;
            height: 500px;
            border: 0;
        }

        .contenedor-botones {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }

        .boton {
            display: inline-block;
            padding: 12px 25px;
            background: #0F9D58;
            color: white;
            text-decoration: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            transition: background 0.3s;
        }

        .boton:hover {
            background: #0b7d45;
        }

        .boton-inicio {
            background: #d4a373;
        }

        .boton-inicio:hover {
            background: #bc8a5f;
        }
    </style>
</head>
<body>

    <h1>Nuestra Ubicación</h1>

    <!-- MAPA VISIBLE DE GOOGLE MAPS -->
    <div class="mapa">
        <iframe
            src="https://maps.google.com/maps?q=Sogamoso%2C%20Boyaca%2C%20Colombia&t=&z=15&ie=UTF8&iwloc=&output=embed"
            allowfullscreen=""
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade">
        </iframe>
    </div>

    <div class="contenedor-botones">
        <!-- BOTÓN CÓMO LLEGAR CORREGIDO -->
        <a class="boton"
           href="https://maps.app.goo.gl/mtfhKUWgPEw49Shr7"
           target="_blank">
           📍 Abrir en Google Maps
        </a>

        <!-- BOTÓN PARA REGRESAR A LA PÁGINA PRINCIPAL -->
        <a class="boton boton-inicio" href="index.html">
           ← Volver al Inicio
        </a>
    </div>

</body>
</html>
